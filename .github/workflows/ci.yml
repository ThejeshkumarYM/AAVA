name: Smart Python CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger_id:
        description: "Unique trigger ID"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run AVASecret
        run: python AVASecret.py
